name: Koelplan

# Project 14 — het avond-koelplan: welke ramen/deuren open vannacht om het huis te
# koelen. Orchestrator-doel 21:15 (ná de kinderkamer-nachtvoorspelling 18:45; laat genoeg om
# gaan); deze cron is de fallback ~30 min later, gededupt door de guard-job.
on:
  schedule:
    - cron: "45 21 * * *"
      timezone: "Europe/Amsterdam"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print zonder Telegram te sturen"
        type: boolean
        default: false

jobs:
  # Dedup t.o.v. de orchestrator: skip de fallback-cron als deze workflow vandaag al
  # een (niet-mislukte) run had. Alleen op `schedule` — handmatige en
  # orchestrator-dispatches draaien altijd door.
  guard:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      handled: ${{ steps.check.outputs.handled }}
    steps:
      - name: Skip if already handled today
        id: check
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          since=$(TZ=Europe/Amsterdam date -d "today 00:00" +%s)
          others=$(gh run list --workflow cooldown-notify.yml -L 40 \
            --json databaseId,createdAt,conclusion \
            --jq "[.[] | select(.databaseId != ${{ github.run_id }}
                   and (.createdAt|fromdateiso8601) >= $since
                   and .conclusion != \"failure\" and .conclusion != \"cancelled\"
                   and .conclusion != \"timed_out\" and .conclusion != \"startup_failure\")] | length")
          if [ "${others:-0}" -gt 0 ]; then
            echo "handled=1" >> "$GITHUB_OUTPUT"
            echo "Al gedraaid vandaag (${others} run(s)) — orchestrator deed dit al, sla over."
          fi

  notify:
    needs: guard
    if: needs.guard.outputs.handled != '1'
    runs-on: ubuntu-latest
    # Stateless: leest alleen de checkout (window_data/learned/uncertainty) + Gist,
    # commit niets.
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run cooldown plan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_GROUP_ID: ${{ secrets.TELEGRAM_CHAT_GROUP_ID }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          # vio.load_learned() leest vent_learned.json uit de artefact-gist —
          # zelfde stille degradatie als bij de nachtvoorspelling zonder dit.
          ARTEFACT_GIST_ID: ${{ secrets.ARTEFACT_GIST_ID }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        # Eén herkansing na 5 min: het plan moet nog dezelfde avond landen.
        # run_guarded alert pas bij de 2e mislukking (fail_threshold=2).
        run: |
          python cooldown_notify.py || {
            echo "::warning::eerste poging mislukt — herkansing over 5 min"
            sleep 300
            python cooldown_notify.py
          }
