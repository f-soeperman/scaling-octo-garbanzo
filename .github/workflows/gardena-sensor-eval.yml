name: Gardena-sensor vs. bodemmodel

# Draait op aanvraag `tools/gardena_sensor_eval.py` (de handmatige
# sensor/model-diagnose van Project 16, zie SOIL_SENSOR_ASSESSMENT.md) tegen
# de échte modelcurve. Die tool is zelf bewust "geen netwerk" (zuivere
# functies over lokale bestanden); `tools/gardena_eval_fetch.py` is de dunne
# gist-laag eromheen. Ophalen (read-only): `data.json` uit de privé
# artefact-gist (`ARTEFACT_GIST_ID`, het bodemmodel), de sensor-maandshards
# uit de privé Gist (`GIST_ID`) en — optioneel, alleen voor de
# bodemtemperatuur-dempingsvergelijking — de buitentemperatuur uit de
# twin2-maandshards (de fetch laat `rooms` bewust weg).
#
# PRIVACY: sinds sep 2026 is de sensorreeks privé — de vochtreeks toont elke
# bewateringsbeurt. Het rapport draagt die reeks, dus het gaat NIET naar de
# joblog of een Actions-artefact (op een publieke repo voor elke ingelogde
# GitHub-gebruiker leesbaar) maar naar de privé artefact-gist als
# `gardena_sensor_eval.txt/.json`. De stdout van de evaluatie wordt daarom
# naar een bestand omgeleid; de log toont alleen de vaste fetch/publish-regels.

on:
  workflow_dispatch:
    inputs:
      zone:
        description: "Zone waarin de prikker zit"
        type: choice
        options: ["shrubs", "lawn"]
        default: "shrubs"
      settle_h:
        description: "Inregel-venster na installatie (uur, 0 = niets weglaten)"
        type: string
        default: "2"

# Alleen lezen: dit schrijft niets terug naar de repo, alleen naar de privé
# artefact-gist (met het Gist-token, los van GITHUB_TOKEN).
permissions:
  contents: read

concurrency:
  group: gardena-sensor-eval
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch gist artefacts (read-only)
        env:
          ARTEFACT_GIST_ID: ${{ secrets.ARTEFACT_GIST_ID }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          python tools/gardena_eval_fetch.py \
            --out-data "$RUNNER_TEMP/gardena_eval/data.json" \
            --out-sensor-dir "$RUNNER_TEMP/gardena_eval/sensor" \
            --out-twin-dir "$RUNNER_TEMP/gardena_eval/twin2"

      - name: Run the evaluation
        env:
          ZONE: ${{ inputs.zone }}
          SETTLE_H: ${{ inputs.settle_h }}
        run: |
          # Rapport naar een bestand, niet naar de (publieke) joblog.
          python tools/gardena_sensor_eval.py \
            --data "$RUNNER_TEMP/gardena_eval/data.json" \
            --history-dir "$RUNNER_TEMP/gardena_eval/sensor" \
            --twin-dir "$RUNNER_TEMP/gardena_eval/twin2" \
            --zone "$ZONE" \
            --settle-h "$SETTLE_H" \
            --json "$RUNNER_TEMP/gardena_eval/report.json" \
            > "$RUNNER_TEMP/gardena_eval/report.txt"

      - name: Publish report to the private artefact gist
        env:
          ARTEFACT_GIST_ID: ${{ secrets.ARTEFACT_GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: python tools/gardena_eval_fetch.py --publish "$RUNNER_TEMP/gardena_eval"
