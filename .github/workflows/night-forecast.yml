name: Nachtvoorspelling kinderkamer

on:
  schedule:
    # Fallback ~30 min ná het orchestrator-doel (18:45 Amsterdam). Normaal
    # dispatcht de Timing Orchestrator dit al; deze cron vuurt alleen als de
    # orchestrator uitviel. 19:15 is later dan het doelmoment, maar beter dan
    # stilte. De guard-job dedupt.
    - cron: "15 19 * * *"
      timezone: "Europe/Amsterdam"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print zonder Telegram te sturen"
        type: boolean
        default: false

jobs:
  # Dedup t.o.v. de orchestrator: skip de fallback-cron als deze workflow vandaag
  # al een (niet-mislukte) run had. Alleen op `schedule` — handmatige en
  # orchestrator-dispatches (beide workflow_dispatch) draaien altijd door.
  guard:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      handled: ${{ steps.check.outputs.handled }}
    steps:
      - name: Skip if already handled today
        id: check
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          since=$(TZ=Europe/Amsterdam date -d "today 00:00" +%s)
          others=$(gh run list --workflow night-forecast.yml -L 40 \
            --json databaseId,createdAt,conclusion \
            --jq "[.[] | select(.databaseId != ${{ github.run_id }}
                   and (.createdAt|fromdateiso8601) >= $since
                   and .conclusion != \"failure\" and .conclusion != \"cancelled\"
                   and .conclusion != \"timed_out\" and .conclusion != \"startup_failure\")] | length")
          if [ "${others:-0}" -gt 0 ]; then
            echo "handled=1" >> "$GITHUB_OUTPUT"
            echo "Al gedraaid vandaag (${others} run(s)) — orchestrator deed dit al, sla over."
          fi

  notify:
    needs: guard
    if: needs.guard.outputs.handled != '1'
    runs-on: ubuntu-latest
    # Sinds aug 2026 niet meer stateless: elke avondrun legt zijn voorspelling vast in
    # data/night_forecast_log (het verificatiespoor van tools/night_verify.py) en
    # commit die — vandaar contents: write + de branch-tip-pin op de checkout (een
    # dispatch mag niet vanaf een oudere momentopname committen, zelfde reden als
    # shade-notify/station-accuracy).
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run night forecast
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_GROUP_ID: ${{ secrets.TELEGRAM_CHAT_GROUP_ID }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          # vio.load_learned() leest vent_learned.json uit de artefact-gist.
          # Zonder dit secret draait de voorspelling stilzwijgend op de priors
          # i.p.v. de gekalibreerde params — het faalt niet, het wordt alleen
          # slechter, en dat is de gevaarlijkste variant.
          ARTEFACT_GIST_ID: ${{ secrets.ARTEFACT_GIST_ID }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        # Eén herkansing na 5 min (korter dan de gebruikelijke 10: het bericht
        # moet nog rond het doelmoment ~19:00 landen). run_guarded alert pas bij
        # de 2e mislukking (fail_threshold=2).
        run: |
          python night_forecast.py || {
            echo "::warning::eerste poging mislukt — herkansing over 5 min"
            sleep 300
            python night_forecast.py
          }

      - name: Commit forecast log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/night_forecast_log
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: nachtvoorspelling gelogd $(date -u +%Y-%m-%dT%H:%M) [skip ci]"
            # De window/vent-loops committen de hele dag door naar main; met
            # `|| true` bleef de repo bij een conflict mid-rebase achter en
            # faalde de push stil — precies het verificatielog-verlies waar
            # dit spoor voor bestaat. Zelfde geharde blok als daily-check.yml
            # (-X theirs: het log is per datum-slot idempotent, onze verse
            # versie wint; falen blijft hard en zichtbaar).
            git rebase --abort 2>/dev/null || true
            if git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"; then
              git push
            else
              git rebase --abort 2>/dev/null || true
              echo "::error::rebase failed, night forecast log not pushed"
              exit 1
            fi
          fi
